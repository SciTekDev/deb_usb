apiVersion: v1
kind: Namespace
metadata:
  name: gitlab
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitlab
  namespace: gitlab
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gitlab
  template:
    metadata:
      labels:
        app: gitlab
    spec:
      nodeSelector:
        role: web
      containers:
        - name: gitlab
          image: gitlab/gitlab-ce:latest
          env:
            - name: GITLAB_OMNIBUS_CONFIG
              value: |
                external_url 'http://gitlab.${DOMAIN}'
                gitlab_rails['gitlab_shell_ssh_port'] = 30022
                nginx['listen_port'] = 80
                nginx['listen_https'] = false
          ports:
            - containerPort: 80
            - containerPort: 22
          readinessProbe:
            httpGet:
              path: /-/readiness
              port: 80
            initialDelaySeconds: 120
            periodSeconds: 15
          resources:
            requests:
              cpu: "1"
              memory: 4Gi
          volumeMounts:
            - { name: config, mountPath: /etc/gitlab }
            - { name: logs, mountPath: /var/log/gitlab }
            - { name: data, mountPath: /var/opt/gitlab }
            - { name: shm, mountPath: /dev/shm }
      volumes:
        - name: config
          hostPath: { path: "${GITLAB_DATA_PATH}/config", type: DirectoryOrCreate }
        - name: logs
          hostPath: { path: "${GITLAB_DATA_PATH}/logs", type: DirectoryOrCreate }
        - name: data
          hostPath: { path: "${GITLAB_DATA_PATH}/data", type: DirectoryOrCreate }
        - name: shm
          emptyDir: { medium: Memory, sizeLimit: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: gitlab
  namespace: gitlab
spec:
  selector:
    app: gitlab
  ports:
    - { name: http, port: 80, targetPort: 80 }
---
apiVersion: v1
kind: Service
metadata:
  name: gitlab-ssh
  namespace: gitlab
spec:
  type: NodePort
  selector:
    app: gitlab
  ports:
    - { name: ssh, port: 22, targetPort: 22, nodePort: 30022 }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gitlab
  namespace: gitlab
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
spec:
  ingressClassName: nginx
  rules:
    - host: gitlab.${DOMAIN}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gitlab
                port: { number: 80 }
