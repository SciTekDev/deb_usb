apiVersion: apps/v1
kind: Deployment
metadata:
  name: elasticsearch
  namespace: logging
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: elasticsearch
  template:
    metadata:
      labels:
        app: elasticsearch
    spec:
      nodeSelector:
        role: storage
      initContainers:
        - name: sysctl
          image: busybox:1.37
          command: ["sysctl", "-w", "vm.max_map_count=262144"]
          securityContext:
            privileged: true
        - name: data-perms
          image: busybox:1.37
          command: ["chown", "-R", "1000:1000", "/usr/share/elasticsearch/data"]
          volumeMounts:
            - { name: data, mountPath: /usr/share/elasticsearch/data }
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:${ELK_VERSION}
          env:
            - { name: discovery.type, value: single-node }
            - { name: xpack.security.enabled, value: "true" }
            - { name: xpack.security.http.ssl.enabled, value: "false" }
            - { name: ES_JAVA_OPTS, value: "-Xms2g -Xmx2g" }
            - name: ELASTIC_PASSWORD
              valueFrom:
                secretKeyRef: { name: elk-credentials, key: elastic }
          ports:
            - { containerPort: 9200 }
          readinessProbe:
            tcpSocket: { port: 9200 }
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests: { cpu: "1", memory: 4Gi }
            limits: { memory: 4Gi }
          volumeMounts:
            - { name: data, mountPath: /usr/share/elasticsearch/data }
      volumes:
        - name: data
          hostPath:
            path: ${ES_DATA_PATH}
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: logging
spec:
  selector:
    app: elasticsearch
  ports:
    - { name: http, port: 9200, targetPort: 9200 }
