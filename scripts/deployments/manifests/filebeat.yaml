apiVersion: v1
kind: ServiceAccount
metadata:
  name: filebeat
  namespace: logging
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: filebeat
rules:
  - apiGroups: [""]
    resources: [namespaces, pods, nodes]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [replicasets, deployments, statefulsets, daemonsets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: filebeat
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: filebeat
subjects:
  - kind: ServiceAccount
    name: filebeat
    namespace: logging
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: filebeat-config
  namespace: logging
data:
  filebeat.yml: |
    filebeat.autodiscover:
      providers:
        - type: kubernetes
          node: ${NODE_NAME}
          hints.enabled: true
          hints.default_config:
            type: container
            paths:
              - /var/log/containers/*${data.kubernetes.container.id}.log
    processors:
      - add_host_metadata: {}
    output.elasticsearch:
      hosts: ["http://elasticsearch.logging:9200"]
      username: elastic
      password: ${ELASTIC_PASSWORD}
    setup.ilm.enabled: true
    setup.template.name: filebeat
    setup.template.pattern: "filebeat-*"
    logging.level: warning
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: filebeat
  namespace: logging
spec:
  selector:
    matchLabels:
      app: filebeat
  template:
    metadata:
      labels:
        app: filebeat
    spec:
      serviceAccountName: filebeat
      tolerations:
        - operator: Exists
      containers:
        - name: filebeat
          image: docker.elastic.co/beats/filebeat:${ELK_VERSION}
          args: ["-c", "/etc/filebeat.yml", "-e"]
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef: { fieldPath: spec.nodeName }
            - name: ELASTIC_PASSWORD
              valueFrom:
                secretKeyRef: { name: elk-credentials, key: elastic }
          securityContext:
            runAsUser: 0
          resources:
            requests: { cpu: 50m, memory: 100Mi }
            limits: { memory: 300Mi }
          volumeMounts:
            - { name: config, mountPath: /etc/filebeat.yml, subPath: filebeat.yml, readOnly: true }
            - { name: data, mountPath: /usr/share/filebeat/data }
            - { name: varlog, mountPath: /var/log, readOnly: true }
      volumes:
        - name: config
          configMap: { name: filebeat-config, defaultMode: 0640 }
        - name: varlog
          hostPath: { path: /var/log }
        - name: data
          hostPath:
            path: /var/lib/filebeat-data
            type: DirectoryOrCreate
