apiVersion: apps/v1
kind: Deployment
metadata:
  name: kibana
  namespace: logging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kibana
  template:
    metadata:
      labels:
        app: kibana
    spec:
      nodeSelector:
        role: web
      containers:
        - name: kibana
          image: docker.elastic.co/kibana/kibana:${ELK_VERSION}
          env:
            - { name: ELASTICSEARCH_HOSTS, value: "http://elasticsearch:9200" }
            - { name: ELASTICSEARCH_USERNAME, value: kibana_system }
            - { name: SERVER_PUBLICBASEURL, value: "http://kibana.${DOMAIN}" }
            - name: ELASTICSEARCH_PASSWORD
              valueFrom:
                secretKeyRef: { name: elk-credentials, key: kibana_system }
          ports:
            - { containerPort: 5601 }
          readinessProbe:
            httpGet: { path: /api/status, port: 5601 }
            initialDelaySeconds: 60
            periodSeconds: 15
          resources:
            requests: { cpu: 250m, memory: 1Gi }
            limits: { memory: 2Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: kibana
  namespace: logging
spec:
  selector:
    app: kibana
  ports:
    - { name: http, port: 80, targetPort: 5601 }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kibana
  namespace: logging
spec:
  ingressClassName: nginx
  rules:
    - host: kibana.${DOMAIN}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kibana
                port: { number: 80 }
